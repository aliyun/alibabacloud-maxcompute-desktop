name: Agentic SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release tag to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test release guards
        run: python3 -m unittest discover -s scripts/tests
      - name: Test and build standalone SDK
        run: mvn -B -ntp -Prelease-artifacts -Djunit.jupiter.execution.parallel.enabled=false clean install
      - name: Validate consumer artifacts
        run: python3 scripts/check-release.py --artifacts
      - name: Compile examples and README quickstart
        run: mvn -B -ntp -f examples/pom.xml package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-test-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Maven artifacts
        if: matrix.java == '21'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-sdk-maven-artifacts
          path: |
            target/agentic-sdk-*.jar
            .flattened-pom.xml
          include-hidden-files: true
